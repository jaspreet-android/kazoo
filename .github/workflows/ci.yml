name: Kazoo CI/CD test

on:
  push:
    branches:
      - "**"
    tags:
      - "*.*.*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: aks1492/kazoo-erlang:otp23.3.4-elixir1.12.3-v2

jobs:

  setup:
    runs-on: ubuntu-latest
    container:
      image: aks1492/kazoo-erlang:otp23.3.4-elixir1.12.3-v2
      options: --user 0
    steps:
      - uses: actions/checkout@v4

      - name: Listing Changes
        run: make changed

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: .
          retention-days: 1


  build:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: aks1492/kazoo-erlang:otp23.3.4-elixir1.12.3-v2
      options: --user 0
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Fix permissions
        run: sudo chown -R $(whoami):$(whoami) .

      - name: Cache rebar3
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: rebar3-${{ hashFiles('rebar.config') }}

      - name: Compile project
        run: rebar3 compile

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: _build
          retention-days: 1


  eunit_tests:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: aks1492/kazoo-erlang:otp23.3.4-elixir1.12.3-v2

    steps:
#      - uses: actions/download-artifact@v4
#        with:
#          name: build

      - name: Compile for test environment
        run: make compile-test

      - name: Run EUnit tests
        run: make eunit


  analyze:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: aks1492/kazoo-erlang:otp23.3.4-elixir1.12.3-v2

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Cache PLT
        uses: actions/cache@v4
        with:
          path: .kazoo.plt
          key: plt-${{ hashFiles('make/deps.mk') }}

      - name: Build PLT
        run: make build-plt

      - name: Run Dialyzer
        run: rebar3 dialyzer


  release:
    needs: [build, eunit_tests, analyze]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    container:
      image: aks1492/kazoo-erlang:otp23.3.4-elixir1.12.3-v2

    services:
      couchdb:
        image: couchdb:3.5.0
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: admin
        ports:
          - 5984:5984

      rabbitmq:
        image: rabbitmq:3.7
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "KZ_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build and package release
        run: |
          make -f release.mk rel
          mkdir -p _build/default/rel/kazoo/log
          cd _build/default/rel
          mv kazoo sipe-${KZ_VERSION}
          tar czf sipe-${KZ_VERSION}.tgz sipe-${KZ_VERSION}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: _build/default/rel/sipe-*.tgz
          retention-days: 7


  deploy:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Set version
        run: echo "KZ_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload artifact to S3
        run: |
          ARTIFACT=$(find . -name "sipe-${KZ_VERSION}.tgz" | head -n1)
          aws s3 cp "$ARTIFACT" \
            "s3://${{ secrets.S3_RELEASES_BUCKET }}/sipe-${KZ_VERSION}.tgz"

      - name: Deploy to EC2 via SSM
        run: |
          S3_PATH="s3://${{ secrets.S3_RELEASES_BUCKET }}/sipe-${KZ_VERSION}.tgz"

          cat > ssm-params.json <<EOF
          {
            "commands": [
              "set -e",
              "cd /tmp",
              "aws s3 cp ${S3_PATH} sipe-${KZ_VERSION}.tgz",
              "tar -xzf sipe-${KZ_VERSION}.tgz",
              "sudo systemctl stop kazoo-ecallmgr",
              "sudo systemctl stop kazoo-applications",
              "sudo ln -sfn /opt/sipe-${KZ_VERSION} /opt/kazoo",
              "sudo systemctl start kazoo-applications",
              "sudo systemctl start kazoo-ecallmgr"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids \
              "${{ secrets.INSTANCE_ID_1 }}" \
              "${{ secrets.INSTANCE_ID_2 }}" \
              "${{ secrets.INSTANCE_ID_3 }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID_1 }}"
