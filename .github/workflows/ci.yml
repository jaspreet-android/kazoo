name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

env:
  BASH_ENV: ".git/.bashrc"
  DOCKER_IMAGE: aks1492/kazoo-erlang:otp23.3.4-elixir1.12.3-v2  # change to your private image

jobs:
  setup:
    runs-on: ubuntu-latest
    container:
      image: ${{ env.DOCKER_IMAGE }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    defaults:
      run:
        shell: bash --login {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listing Changes
        run: make changed

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: .

  build:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: ${{ env.DOCKER_IMAGE }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    defaults:
      run:
        shell: bash --login {0}
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build/default/lib
          key: rebar3-cache-${{ hashFiles('rebar.config') }}

      - name: Fix permissions
        run: sudo chown -R $(whoami):$(whoami) .

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            g++ \
            make \
            libc6-dev \
            libssl-dev \
            libncurses5-dev \
            git \
            curl \
            ca-certificates
          # libiconv is part of glibc on Linux — verify it's available
          dpkg -l | grep -i iconv || true
          ldconfig -p | grep iconv || true

      - name: Compile project
        run: |
          set -e
          # Run with verbose to expose linker errors
          REBAR_COLOR=0 rebar3 compile 2>&1 | tee /tmp/compile.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== Last 50 lines of compile log ==="
            tail -50 /tmp/compile.log
            echo "=== Checking for eiconv link errors ==="
            grep -A5 -B5 "eiconv" /tmp/compile.log || true
            exit $EXIT_CODE
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: _build

  eunit_tests:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ env.DOCKER_IMAGE }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    defaults:
      run:
        shell: bash --login {0}
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: _build

      - name: Compile for test environment
        run: |
          set -e
          make compile-test

      - name: Run Eunit tests
        run: |
          set -e
          make eunit

  analyze:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ env.DOCKER_IMAGE }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    defaults:
      run:
        shell: bash --login {0}
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: _build

      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: .kazoo.plt
          key: plt-v2-${{ hashFiles('make/deps.mk') }}

      - name: Build PLT file
        run: |
          set -e
          make build-plt

      - name: Run Dialyzer
        timeout-minutes: 45
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "Starting Dialyzer analysis at $(date)"

          show_progress() {
            while true; do
              sleep 10
              CURRENT_TIME=$(date +%s)
              ELAPSED=$((CURRENT_TIME - START_TIME))
              echo "[${ELAPSED}s / $((ELAPSED/60))m $((ELAPSED%60))s] Dialyzer analysis in progress..."
            done
          }

          show_progress &
          PROGRESS_PID=$!

          rebar3 dialyzer
          EXIT_CODE=$?

          kill $PROGRESS_PID 2>/dev/null || true
          wait $PROGRESS_PID 2>/dev/null || true

          END_TIME=$(date +%s)
          TOTAL_TIME=$((END_TIME - START_TIME))
          echo "Dialyzer completed in $((TOTAL_TIME/60))m $((TOTAL_TIME%60))s (exit code: $EXIT_CODE)"
          exit $EXIT_CODE

      - name: Save PLT cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .kazoo.plt
          key: plt-v2-${{ hashFiles('make/deps.mk') }}

  release:
    needs: [build, eunit_tests, analyze]
    if: startsWith(github.ref, 'refs/tags/') && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    container:
      image: ${{ env.DOCKER_IMAGE }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    services:
      couchdb:
        image: couchdb:3.5.0
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: admin
      rabbitmq:
        image: rabbitmq:3.7
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    env:
      TZ: UTC
    defaults:
      run:
        shell: bash --login {0}
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: _build

      - name: Set KZ_VERSION from git tag
        run: |
          export KZ_VERSION=$(git describe --tags --always)
          echo "KZ_VERSION=${KZ_VERSION}" >> $GITHUB_ENV
          echo "Building version: ${KZ_VERSION}"

      - name: Build and package release
        run: |
          set -e
          make -f release.mk rel
          make sup_completion
          mkdir -p _build/default/rel/kazoo/log
          cd _build/default/rel
          mv kazoo sipe-${KZ_VERSION}
          tar czf sipe-${KZ_VERSION}.tgz sipe-${KZ_VERSION}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazoo-release
          path: _build/default/rel/sipe-*.tgz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: _build/default/rel/sipe-${{ env.KZ_VERSION }}.tgz

  deploy_to_instances:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_PAGER: ""
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: kazoo-release
          path: _build/default/rel

      - name: Set KZ_VERSION from git tag
        run: |
          echo "KZ_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "KZ_VERSION: ${GITHUB_REF_NAME}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload artifact to S3
        run: |
          set -e
          ARTIFACT_PATH=$(find _build/default/rel -name "sipe-${KZ_VERSION}.tgz" -type f | head -n1)

          if [ -z "$ARTIFACT_PATH" ]; then
            echo "ERROR: Could not find sipe-${KZ_VERSION}.tgz"
            ls -lah _build/default/rel/ || echo "Directory does not exist"
            exit 1
          fi

          echo "Found artifact: ${ARTIFACT_PATH}"
          aws s3 cp "${ARTIFACT_PATH}" \
            "s3://${{ secrets.S3_RELEASES_BUCKET }}/sipe-${KZ_VERSION}.tgz" \
            --region "${{ secrets.AWS_REGION }}"
          echo "Upload complete!"

      - name: Deploy to EC2 instances via SSM
        run: |
          set -e
          S3_PATH="s3://${{ secrets.S3_RELEASES_BUCKET }}/sipe-${KZ_VERSION}.tgz"
          AWS_REGION="${{ secrets.AWS_REGION }}"
          INSTANCE_ID_1="${{ secrets.INSTANCE_ID_1 }}"
          INSTANCE_ID_2="${{ secrets.INSTANCE_ID_2 }}"
          INSTANCE_ID_3="${{ secrets.INSTANCE_ID_3 }}"

          echo "=== Deployment Info ==="
          echo "Version:    ${KZ_VERSION}"
          echo "Instance 1: ${INSTANCE_ID_1}"
          echo "Instance 2: ${INSTANCE_ID_2}"
          echo "Instance 3: ${INSTANCE_ID_3}"
          echo "Artifact:   ${S3_PATH}"
          echo "Region:     ${AWS_REGION}"
          echo "======================="

          cat > /tmp/build_ssm.py <<'PYEOF'
          import json, os

          kz_version = os.environ['KZ_VERSION']
          s3_path    = os.environ['S3_PATH']
          aws_region = os.environ['AWS_REGION']

          commands = [
            "#!/bin/bash",
            "set -euo pipefail",
            "KZ_VERSION='" + kz_version + "'",
            "S3_PATH='"    + s3_path    + "'",
            "AWS_REGION='" + aws_region + "'",
            'echo "[$(date)] === Starting deployment of ' + kz_version + ' ==="',
            "cd /tmp",
            'aws s3 cp "${S3_PATH}" "sipe-${KZ_VERSION}.tgz" --region "${AWS_REGION}"',
            'tar -xzf "sipe-${KZ_VERSION}.tgz"',
            'LATEST_DIR="sipe-' + kz_version + '"',
            'INSTALL_PATH="/opt/${LATEST_DIR}"',
            'if [[ ! -d "${INSTALL_PATH}" ]]; then sudo mv "${LATEST_DIR}" /opt/; else echo "${INSTALL_PATH} already exists, skipping move."; fi',
            'sudo chown -R kazoo:daemon "${INSTALL_PATH}"',
            'sudo systemctl stop kazoo-ecallmgr',
            'sudo systemctl stop kazoo-applications',
            'sleep 3',
            'sudo ln -sfn "${INSTALL_PATH}" /opt/kazoo',
            'sudo systemctl start kazoo-applications',
            'sleep 5',
            'sudo systemctl start kazoo-ecallmgr',
            "sudo systemctl is-active kazoo-applications && echo 'kazoo-applications: OK' || (echo 'kazoo-applications: FAILED' && exit 1)",
            "sudo systemctl is-active kazoo-ecallmgr    && echo 'kazoo-ecallmgr: OK'    || (echo 'kazoo-ecallmgr: FAILED' && exit 1)",
            'echo "[$(date)] Upgraded to: ${INSTALL_PATH}" | sudo tee -a /var/log/kazoo-upgrade.log',
            'rm -f "/tmp/sipe-' + kz_version + '.tgz"',
            'echo "[$(date)] === Deployment complete! ==="',
          ]

          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump({"commands": commands}, f, indent=2)
          print("SSM params JSON written successfully.")
          PYEOF

          KZ_VERSION="${KZ_VERSION}" S3_PATH="${S3_PATH}" AWS_REGION="${AWS_REGION}" \
          python3 /tmp/build_ssm.py

          python3 -m json.tool /tmp/ssm-params.json > /dev/null && echo "JSON is valid!"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID_1}" "${INSTANCE_ID_2}" "${INSTANCE_ID_3}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Kazoo ${KZ_VERSION}" \
            --parameters file:///tmp/ssm-params.json \
            --output-s3-bucket-name "${{ secrets.S3_LOGS_BUCKET }}" \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)

          [ -z "${COMMAND_ID}" ] && echo "ERROR: No CommandId returned." && exit 1

          echo "SSM Command ID: ${COMMAND_ID}"
          MAX_WAIT=600; POLL_INTERVAL=15; ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
            IN_PROGRESS=$(aws ssm list-command-invocations \
              --command-id "${COMMAND_ID}" --region "${AWS_REGION}" \
              --query "length(CommandInvocations[?Status=='InProgress' || Status=='Pending'])" \
              --output text)
            echo "[${ELAPSED}s] In-progress: ${IN_PROGRESS}"
            [ "${IN_PROGRESS}" == "0" ] && echo "All invocations finished." && break
          done

          echo "=== Command Output Per Instance ==="
          for INSTANCE in "${INSTANCE_ID_1}" "${INSTANCE_ID_2}" "${INSTANCE_ID_3}"; do
            echo "--- ${INSTANCE} ---"
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" --instance-id "${INSTANCE}" \
              --region "${AWS_REGION}" \
              --query "{Status:Status,ExitCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
              --output json || echo "Could not retrieve output for ${INSTANCE}"
          done

          FAILED=$(aws ssm list-command-invocations \
            --command-id "${COMMAND_ID}" --region "${AWS_REGION}" \
            --query "length(CommandInvocations[?Status=='Failed' || Status=='TimedOut' || Status=='Cancelled' || Status=='DeliveryTimedOut'])" \
            --output text)

          [ "${FAILED}" != "0" ] && echo "ERROR: ${FAILED} instance(s) failed!" && exit 1
          echo "All instances deployed successfully!"
