name: Kazoo CI/CD

on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:

# ---------------------------
# BUILD
# ---------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "23.3"
          elixir-version: "1.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake \
            libtool pkg-config libssl-dev

      - name: Cache rebar deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: rebar-${{ hashFiles('rebar.config') }}

      - name: Compile
        run: rebar3 compile


# ---------------------------
# EUNIT TESTS
# ---------------------------
  eunit_tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "23.3"
          elixir-version: "1.12"

      - run: make compile-test
      - run: make eunit


# ---------------------------
# DIALYZER ANALYSIS
# ---------------------------
  analyze:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "23.3"
          elixir-version: "1.12"

      - uses: actions/cache@v4
        with:
          path: .kazoo.plt
          key: plt-${{ hashFiles('make/deps.mk') }}

      - run: make build-plt
      - run: rebar3 dialyzer


# ---------------------------
# RELEASE (tag only)
# ---------------------------
  release:
    needs: [build, eunit_tests, analyze]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    services:
      couchdb:
        image: couchdb:3.5.0
        ports: ['5984:5984']
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: admin

      rabbitmq:
        image: rabbitmq:3.7
        ports: ['5672:5672']

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "23.3"
          elixir-version: "1.12"

      - name: Set version
        run: echo "KZ_VERSION=$(git describe --tags --always)" >> $GITHUB_ENV

      - name: Build release
        run: |
          make -f release.mk rel
          mkdir -p _build/default/rel/kazoo/log
          cd _build/default/rel
          mv kazoo sipe-${KZ_VERSION}
          tar czf sipe-${KZ_VERSION}.tgz sipe-${KZ_VERSION}

      - uses: actions/upload-artifact@v4
        with:
          name: kazoo-release
          path: _build/default/rel/*.tgz


# ---------------------------
# DEPLOY (tag only)
# ---------------------------
  deploy:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kazoo-release
          path: rel/

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload release to S3
        run: |
          FILE=$(ls rel/*.tgz | head -1)
          aws s3 cp "$FILE" s3://${{ secrets.S3_RELEASES_BUCKET }}/
